name: poc_app_usage
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  app_usage: ^4.0.1
  carousel_slider: ^5.1.1
  logger: ^2.6.2
  http: ^1.5.0
  app_settings: ^6.0.0
  device_info_plus: ^12.2.0
  shared_preferences: ^2.2.2
  android_intent_plus: ^6.0.0
  fl_chart: ^1.1.1
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

  #test
  test: any
  mockito: ^5.0.0 # 버전 확인 필요
  build_runner: ^2.0.0 # 버전 확인 필요
  
  # ★ 아이콘 & 스플래시 패키지 추가 (버전 고정)
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.0

flutter:
  uses-material-design: true
  assets:
    - assets/logo/
    - assets/applogo.png
    - assets/images/

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/applogo.png" # 이미지 경로 확인 필수!
  min_sdk_android: 17

flutter_native_splash:
  color: "#FFFFFF" # 배경색 (흰색)
  image: "assets/applogo.png" # 가운데 뜰 로고
  android_12:
    image: "assets/applogo.png"
    color: "#FFFFFF"