name: Flutter Unit Test
on:
  push:
    branches: [ develop ]
  pull_request:
    branches: [ develop ]

jobs:
  unit-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v3

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7

      - name: Install dependencies
        working-directory: poc_app_usage
        run: flutter pub get

      - name: Run unit tests
        working-directory: poc_app_usage
        run: flutter test test/unit
