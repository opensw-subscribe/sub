name: Flutter CI

on: 
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality-check:
    runs-on: ubuntu-latest
  
    defaults:
      run:
        working-directory: ./Frontend/poc_app_usage

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.35.7
          channel: 'stable'
          
      - name: Cache pub packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            Frontend/poc_app_usage/.dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pub-
          
      - name: Get Dependencies
        run: flutter pub get
      
      - name: Restore google-services.json
        run: |
          echo "${{ secrets.GOOGLE_SERVICES_JSON_B64 }}" | base64 --decode > android/app/google-services.json
        
      - name: Format Code
        run: dart format lib/ test/
        
      - name: Run Flutter Analyze
        run: flutter analyze --fatal-infos

      - name: Run Widget Tests
        run: flutter test test/widgets/
      
      - name: Generate Coverage
        run: flutter test --coverage test/widgets/
        
      - name: Upload Coverage
        uses: codecov/codecov-action@v3
        with:
          files: ./Frontend/poc_app_usage/coverage/lcov.info
          fail_ci_if_error: false
      
      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*') }}
          restore-keys: |
            ${{ runner.os }}-gradle-
      
      - name: Build Android APK
        run: flutter build apk --debug
        
      - name: Check Outdated Packages
        run: flutter pub outdated
        continue-on-error: true
