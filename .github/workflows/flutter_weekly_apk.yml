name: Flutter Daily APK Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Restore google-services.json
        run: |
          mkdir -p Frontend/poc_app_usage/android/app
          echo '${{ secrets.GOOGLE_SERVICES_JSON }}' > Frontend/poc_app_usage/android/app/google-services.json

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.x'

      - name: Install dependencies
        working-directory: Frontend/poc_app_usage
        run: flutter pub get

      - name: Build release APK
        working-directory: Frontend/poc_app_usage
        run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-apk
          path: Frontend/poc_app_usage/build/app/outputs/flutter-apk/app-release.apk
