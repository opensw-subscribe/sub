name: Docker Build Test
on: [push, pull_request]

jobs:
  docker-build:
    runs-on: ubuntu-latest
    
    steps:
      # 1. GitHub 저장소의 코드
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # 2. Docker 이미지 빌드
      - name: Build Backend Docker Image
        # 'docker build' 명령어 실행
        # -t fastapi-app:local
        run: docker build -t fastapi-app:local ./Backend