name: Flutter Code Analysis
on: [push, pull_request]

jobs:
  analyze:
    runs-on: ubuntu-latest
  
    defaults:
      run:
        working-directory: ./Frontend/poc_app_usage

    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          # 사용하는 Flutter 버전
          flutter-version: 3.35.7 
          
      # 1. 의존성 설치 (frontend 폴더 내의 pubspec.yaml 사용)
      - name: Get Dependencies
        run: flutter pub get 
        
      # 2. 코드 분석 실행 (frontend 폴더 내의 코드를 분석)
      - name: Run Flutter Analyze
        run: flutter analyze