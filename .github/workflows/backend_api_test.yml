name: Backend API Integration Test
on: [push, pull_request]

jobs:
  backend-integration-test:
    runs-on: ubuntu-latest
    
    # 🚨 중요: 모든 'run' 명령어는 ./Backend 폴더를 기준으로 실행됩니다.
    defaults:
      run:
        working-directory: ./Backend

    steps:
      # 1. GitHub 저장소의 코드 Checkout
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      # 2. Docker 이미지 빌드
      - name: Build Backend Docker Image
        run: docker build -t backend-app:local .
        
      # 3. Minikube 및 Kubernetes 설정
      - name: Set up Minikube and Kubernetes
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: 'latest' # Minikube 설치

      # 4. Secret 파일 생성 (GitHub Secret 사용)
      # 🚨 working-directory가 ./Backend 이므로, 파일이 ./Backend/service_account_key.json에 생성됩니다.
      - name: Create Firebase Secret File
        run: |
          # GitHub Secret의 내용을 service_account_key.json 파일로 임시 저장
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > service_account_key.json 

      # 5. 배포 및 서비스 노출
      - name: Deploy to Minikube and Get URL
        run: |
          echo "--- 5-1. Docker 이미지를 Minikube 환경으로 로드 ---"
          minikube image load backend-app:local

          echo "--- 5-2. Kubernetes Secret 생성 (Firebase, Postgres) ---"
          # 4번 Firebase Secret 생성 (파일이 현재 디렉토리(.Backend)에 존재)
          kubectl create secret generic firebase-key-secret --from-file=service_account_key.json
          
          # 5번 Postgres Secret 생성
          kubectl create secret generic postgres-secret --from-literal=POSTGRES_USER=postgres --from-literal=POSTGRES_PASSWORD=1234
          
          # 디버깅: Secret이 제대로 생성되었는지 확인
          kubectl get secrets
          
          echo "--- 5-3. Deployment 및 Service 배포 (k8s 폴더 사용) ---"
          kubectl apply -f k8s/

          # 디버깅: Deployment가 실제로 생성되었는지 확인
          kubectl get deployments
          
          kubectl logs deployment/backend-deployment
          
          echo "--- 5-4. 배포 완료 대기 ---"
          kubectl wait --for=condition=Available deployment/backend-deployment --timeout=300s
          
          echo "--- 5-5. 백엔드 서비스 URL 획득 및 환경 변수 설정 ---"
          # Minikube Service 이름이 'backend-service'라고 가정합니다.
          BACKEND_URL=$(minikube service backend-service --url)
          
          # 다음 스텝에서 사용할 수 있도록 환경 변수 설정
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "획득된 백엔드 URL: $BACKEND_URL"

      # 6. Python 및 Pytest 설정
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      # 7. 테스트 종속성 설치
      - name: Install Test dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests # 'requests'는 API 호출에 필요

      # 8. 테스트 실행 (3단계)
      - name: Run Backend Integration Test
        # 이전 스텝에서 설정된 $BACKEND_URL 환경 변수를 Pytest가 사용합니다.
        run: pytest test_api.py # 또는 pytest test/ (테스트 파일 위치에 따라)