name: Backend API Integration Test
on: [push, pull_request]

jobs:
  backend-integration-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Build Backend Docker Image
        run: docker build -t fastapi-app:local .
        
      - name: Set up Minikube and Kubernetes
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: 'latest'

      - name: Create Firebase Secret File
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > service_account_key.json 

      - name: Deploy to Minikube
        run: |
          echo "🚀 배포 시작"
          
          echo "--- 1. Docker 이미지 로드 ---"
          minikube image load fastapi-app:local

          echo "--- 2. Kubernetes Secret 생성 ---"
          kubectl create secret generic firebase-key-secret --from-file=service_account_key.json
          kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=POSTGRES_PASSWORD=1234
          
          echo "--- 3. Deployment 및 Service 배포 ---"
          kubectl apply -f k8s/

          echo "--- 4. Deployment 준비 대기 ---"
          echo "⏳ DB 배포 대기..."
          kubectl wait --for=condition=Available deployment/db --timeout=600s 
          echo "✅ DB Deployment 준비 완료"
          
          echo "⏳ Redis 배포 대기..."
          kubectl wait --for=condition=Available deployment/redis --timeout=300s
          echo "✅ Redis Deployment 준비 완료"
          
          echo "⏳ Backend 배포 대기..."
          kubectl wait --for=condition=Available deployment/backend-deployment --timeout=300s
          echo "✅ Backend Deployment 준비 완료"

          echo "--- 5. Pod 상태 확인 (최대 3분) ---"
          for i in {1..36}; do
            TOTAL_PODS=$(kubectl get pods --no-headers 2>/dev/null | wc -l)
            RUNNING_PODS=$(kubectl get pods --no-headers 2>/dev/null | grep "Running" | wc -l)
            
            echo "[$i/36] Pod 상태: $RUNNING_PODS/$TOTAL_PODS Running"
            
            # Backend Pod 상태 상세 확인
            BACKEND_STATUS=$(kubectl get pods -l io.kompose.service=backend --no-headers 2>/dev/null | awk '{print $3}')
            echo "  Backend 상태: $BACKEND_STATUS"
            
            # CrashLoopBackOff 감지
            if echo "$BACKEND_STATUS" | grep -q "CrashLoopBackOff"; then
              echo ""
              echo "❌ Backend가 CrashLoopBackOff 상태입니다!"
              echo ""
              echo "=== Backend 로그 (크래시 원인) ==="
              kubectl logs deployment/backend-deployment --tail=100
              echo ""
              echo "=== 이전 컨테이너 로그 ==="
              kubectl logs deployment/backend-deployment --previous --tail=50 || echo "이전 로그 없음"
              exit 1
            fi
            
            if [ "$RUNNING_PODS" -eq "$TOTAL_PODS" ] && [ "$TOTAL_PODS" -gt 0 ]; then
              echo "✅ 모든 Pod Running!"
              kubectl get pods
              break
            fi
            
            if [ $((i % 6)) -eq 0 ]; then
              echo "현재 Pod 상태:"
              kubectl get pods
              echo ""
              echo "=== Backend 로그 (최근 20줄) ==="
              kubectl logs deployment/backend-deployment --tail=20 || echo "로그 없음"
              echo ""
            fi
            
            sleep 5
          done

          echo "--- 6. 최종 상태 확인 ---"
          kubectl get pods
          kubectl get services

          echo "--- 7. 백엔드 서비스 URL 획득 ---"
          BACKEND_URL=$(minikube service backend-service --url)
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "✅ 백엔드 URL: $BACKEND_URL"

      - name: Wait for Backend Health Check
        run: |
          echo "🔍 백엔드 헬스체크 시작..."
          echo "📡 대상 URL: $BACKEND_URL"
          
          # 먼저 Backend 로그 확인
          echo ""
          echo "=== 헬스체크 전 Backend 로그 확인 ==="
          kubectl logs deployment/backend-deployment --tail=50
          echo ""
          
          MAX_ATTEMPTS=20
          ATTEMPT=0
          SLEEP_TIME=15
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "[$ATTEMPT/$MAX_ATTEMPTS] 헬스체크 시도 중..."
            
            # Pod 상태 확인
            POD_STATUS=$(kubectl get pods -l io.kompose.service=backend --no-headers | awk '{print $3}')
            echo "  현재 Backend Pod 상태: $POD_STATUS"
            
            # CrashLoopBackOff면 즉시 중단
            if echo "$POD_STATUS" | grep -q "CrashLoopBackOff"; then
              echo "❌ Backend가 크래시 상태입니다!"
              kubectl logs deployment/backend-deployment --tail=100
              exit 1
            fi
            
            # 헬스체크 시도
            if curl -f -s --max-time 5 "$BACKEND_URL/health" > /dev/null 2>&1; then
              echo "✅ 백엔드 준비 완료!"
              exit 0
            fi
            
            # 3회마다 로그 출력
            if [ $((ATTEMPT % 3)) -eq 0 ]; then
              echo ""
              echo "=== Backend 로그 (최근 30줄) ==="
              kubectl logs deployment/backend-deployment --tail=30
              echo ""
            fi
            
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⏳ ${SLEEP_TIME}초 대기 후 재시도..."
              sleep $SLEEP_TIME
            fi
          done
          
          echo ""
          echo "❌ 백엔드 헬스체크 실패 (${MAX_ATTEMPTS}회 시도)"
          echo ""
          echo "=== 최종 디버깅 정보 ==="
          echo "--- Pod 상태 ---"
          kubectl get pods
          echo ""
          echo "--- Backend 로그 (전체) ==="
          kubectl logs deployment/backend-deployment --tail=200
          echo ""
          echo "--- 이전 컨테이너 로그 ---"
          kubectl logs deployment/backend-deployment --previous --tail=100 || echo "이전 로그 없음"
          exit 1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Test Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run Backend Integration Test
        run: |
          echo "🧪 API 통합 테스트 실행"
          echo "📡 테스트 대상: $BACKEND_URL"
          pytest test/test_api.py -v -s
        env:
          BACKEND_URL: ${{ env.BACKEND_URL }}

      - name: Debug on Failure
        if: failure()
        run: |
          echo "=== 테스트 실패 - 전체 디버깅 정보 ==="
          echo ""
          echo "--- Pod 상태 ---"
          kubectl get pods
          echo ""
          echo "--- Backend 현재 로그 ---"
          kubectl logs deployment/backend-deployment --tail=200
          echo ""
          echo "--- Backend 이전 로그 ---"
          kubectl logs deployment/backend-deployment --previous --tail=100 || echo "이전 로그 없음"
          echo ""
          echo "--- DB 로그 ---"
          kubectl logs deployment/db --tail=100
          echo ""
          echo "--- Redis 로그 ---"
          kubectl logs deployment/redis --tail=50
          echo ""
          echo "--- Events ---"
          kubectl get events --sort-by='.lastTimestamp' | tail -20
