name: Backend API Integration Test
on: [push, pull_request]

jobs:
  backend-integration-test:
    runs-on: ubuntu-latest
    
    defaults:
      run:
        working-directory: ./Backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        
      - name: Build Backend Docker Image
        run: docker build -t fastapi-app:local .
        
      - name: Set up Minikube and Kubernetes
        uses: medyagh/setup-minikube@latest
        with:
          minikube-version: 'latest'

      - name: Create Firebase Secret File
        run: |
          echo "${{ secrets.FIREBASE_SERVICE_ACCOUNT_KEY }}" > service_account_key.json 

      - name: Deploy to Minikube
        run: |
          echo "--- 1. Docker 이미지 로드 ---"
          minikube image load fastapi-app:local

          echo "--- 2. Kubernetes Secret 생성 ---"
          kubectl create secret generic firebase-key-secret --from-file=service_account_key.json
          kubectl create secret generic postgres-secret \
            --from-literal=POSTGRES_USER=postgres \
            --from-literal=POSTGRES_PASSWORD=1234
          
          echo "--- 3. Deployment 및 Service 배포 ---"
          kubectl apply -f k8s/

          echo "--- 4. DB 배포 대기 ---"
          kubectl wait --for=condition=Available deployment/db --timeout=600s 
          echo "⏳ DB Pod Ready 대기..."
          kubectl wait --for=condition=Ready pod -l app=db --timeout=300s || true

          echo "--- 5. Redis 배포 대기 ---"
          kubectl wait --for=condition=Available deployment/redis --timeout=300s
          echo "⏳ Redis Pod Ready 대기..."
          kubectl wait --for=condition=Ready pod -l app=redis --timeout=300s || true

          echo "--- 6. 백엔드 배포 대기 ---"
          kubectl wait --for=condition=Available deployment/backend-deployment --timeout=300s
          echo "⏳ Backend Pod Ready 대기..."
          kubectl wait --for=condition=Ready pod -l app=backend --timeout=300s || true

          echo "--- 7. 백엔드 서비스 URL 획득 ---"
          BACKEND_URL=$(minikube service backend-service --url)
          echo "BACKEND_URL=$BACKEND_URL" >> $GITHUB_ENV
          echo "✅ 백엔드 URL: $BACKEND_URL"

      # ✨ 핵심: 헬스체크 재시도 로직
      - name: Wait for Backend Health Check
        run: |
          echo "🔍 백엔드 헬스체크 시작..."
          MAX_ATTEMPTS=60
          ATTEMPT=0
          SLEEP_TIME=5
          
          while [ $ATTEMPT -lt $MAX_ATTEMPTS ]; do
            ATTEMPT=$((ATTEMPT + 1))
            echo "[$ATTEMPT/$MAX_ATTEMPTS] 헬스체크 시도 중..."
            
            # curl로 헬스체크 (실패해도 계속)
            if curl -f -s --max-time 5 "$BACKEND_URL/health" > /dev/null 2>&1; then
              echo "✅ 백엔드 준비 완료!"
              echo "📡 최종 URL: $BACKEND_URL"
              exit 0
            fi
            
            # 실패 시 대기
            if [ $ATTEMPT -lt $MAX_ATTEMPTS ]; then
              echo "⏳ ${SLEEP_TIME}초 대기 후 재시도..."
              sleep $SLEEP_TIME
            fi
          done
          
          # 최대 시도 횟수 초과
          echo "❌ 백엔드 헬스체크 실패 (${MAX_ATTEMPTS}회 시도)"
          echo ""
          echo "=== 디버깅 정보 ==="
          echo "--- Pod 상태 ---"
          kubectl get pods
          echo ""
          echo "--- Backend 로그 (최근 100줄) ---"
          kubectl logs deployment/backend-deployment --tail=100 || echo "로그 없음"
          echo ""
          echo "--- DB 로그 (최근 50줄) ---"
          kubectl logs deployment/db --tail=50 || echo "로그 없음"
          exit 1

      # ✨ 추가: 최종 상태 확인
      - name: Show Final Status
        run: |
          echo "=== 최종 배포 상태 ==="
          echo "--- Pods ---"
          kubectl get pods
          echo ""
          echo "--- Services ---"
          kubectl get services
          echo ""
          echo "--- Backend URL ---"
          echo "$BACKEND_URL"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      
      - name: Install Test Dependencies
        run: |
          pip install -r requirements.txt
          pip install pytest requests

      - name: Run Backend Integration Test
        run: |
          echo "🧪 테스트 실행 시작"
          echo "📡 테스트 대상 URL: $BACKEND_URL"
          pytest test/test_api.py -v -s
        env:
          BACKEND_URL: ${{ env.BACKEND_URL }}

      # ✨ 실패 시 디버깅 정보
      - name: Debug on Failure
        if: failure()
        run: |
          echo "=== 테스트 실패 - 디버깅 정보 ==="
          echo "--- Pod 상태 ---"
          kubectl get pods
          echo ""
          echo "--- Backend 로그 (전체) ---"
          kubectl logs deployment/backend-deployment --tail=200
          echo ""
          echo "--- DB 로그 ---"
          kubectl logs deployment/db --tail=100
          echo ""
          echo "--- Redis 로그 ---"
          kubectl logs deployment/redis --tail=50
          echo ""
          echo "--- 환경 변수 ---"
          echo "BACKEND_URL: $BACKEND_URL"
